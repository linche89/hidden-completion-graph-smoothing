[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hidden-completion"
version = "0.1.0"
description = "Exact finite-scenario SDP for hidden graph completions"
readme = "hidden_completion/README.md"
requires-python = ">=3.11"
dependencies = [
  "cvxpy>=1.7,<1.8",
  "numpy>=2.0",
]

[project.scripts]
hidden-completion = "hidden_completion.cli:main"

[tool.setuptools.packages.find]
include = ["hidden_completion*"]
