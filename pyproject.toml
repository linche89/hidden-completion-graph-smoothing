[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hidden-completion"
version = "0.1.0"
description = "Exact robust local graph-smoother design under hidden completions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cvxpy>=1.7,<1.8",
  "numpy>=2.0",
]

[project.scripts]
hidden-completion = "hidden_completion.cli:main"

[project.optional-dependencies]
experiments = [
  "networkx>=3.6,<3.7",
  "psutil>=7.2,<8",
  "scipy>=1.17,<1.18",
]

[tool.setuptools.packages.find]
include = ["hidden_completion*", "experiments.smoother*"]
